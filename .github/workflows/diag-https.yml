name: diag-https
on:
  push:
    branches: [diag-https]
permissions:
  pages: read
  contents: read
jobs:
  diag:
    runs-on: ubuntu-latest
    steps:
      - env:
          GH_TOKEN: ${{ github.token }}
        run: |
          echo "== Pages API"; gh api repos/${{ github.repository }}/pages || true
          for u in https://homecostpulse.com https://www.homecostpulse.com http://homecostpulse.com http://www.homecostpulse.com; do
            echo "== $u"; curl -sS -o /dev/null -w "%{http_code} -> %{redirect_url} ssl_verify=%{ssl_verify_result}\n" --max-time 20 "$u" || true
          done
          for h in homecostpulse.com www.homecostpulse.com; do
            echo "== cert $h"; echo | openssl s_client -connect $h:443 -servername $h 2>/dev/null | openssl x509 -noout -subject -issuer -dates -ext subjectAltName || true
          done
          echo "== DNS"; dig +short homecostpulse.com A; dig +short homecostpulse.com AAAA; dig +short www.homecostpulse.com; dig +short homecostpulse.com CAA
